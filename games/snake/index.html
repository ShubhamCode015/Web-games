<!DOCTYPE html>
<html lang="en" manifest="../../manifest.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07120c">
<title>Snake</title>
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>
window.addEventListener('error',function(e){
  try{
    var d=document.getElementById('errbox');
    if(!d){
      d=document.createElement('div');
      d.id='errbox';
      d.setAttribute('role','alert');
      d.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fff;font:12px/1.4 system-ui,sans-serif;padding:8px 10px;max-height:45%;overflow:auto';
      (document.body||document.documentElement).appendChild(d);
    }
    d.textContent='Error: '+((e&&e.message)||'unknown error — please reload');
  }catch(_){}
},true);
</script>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <div class="brand">SNAKE<span>classic</span></div>
    <button id="mute" class="iconbtn" type="button">Sound: On</button>
  </div>

  <div id="hud">
    <div class="box"><span class="lbl">Score</span><b id="gscore">0</b></div>
    <div class="box"><span class="lbl">Best</span><b id="gbest">0</b></div>
    <div class="box gold"><span class="lbl">Coins</span><b id="gcoins">0</b></div>
  </div>

  <div id="boardWrap">
    <div id="board">
      <canvas id="c" width="320" height="320" aria-label="Snake game board"></canvas>
    </div>
  </div>

  <div id="gameFooter">
    <span id="hint" class="small">2/4/6/8 move &middot; 5 pause</span>
    <div class="fbtns">
      <button id="pauseBtn" type="button">Pause</button>
      <button id="menuBtn" type="button" class="alt">Menu</button>
    </div>
  </div>

  <div id="menu" class="overlay">
    <h2>Snake</h2>
    <p id="userinfo"></p>
    <p>Level <b id="mlevel"></b> | XP <span id="mxp"></span>/<span id="mneed"></span></p>
    <p>Money: <b id="mmoney"></b></p>
    <p>Best: <b id="mbest"></b> &middot; Longest: <b id="mlength"></b></p>
    <p id="mstats" class="small"></p>
    <button id="start">Play</button>
    <button id="missions">Missions</button>
    <div class="btnrow">
      <button id="muteMenu" class="alt">Sound: On</button>
      <button id="home" class="alt">Home</button>
    </div>
    <p class="small">Classic rules: eat apples, grow, never hit a wall or yourself.</p>
  </div>

  <div id="missv" class="overlay hidden">
    <h2>Missions</h2>
    <div id="mlist"></div>
    <button id="back2">Back</button>
  </div>

  <div id="pausev" class="overlay hidden">
    <h2>Paused</h2>
    <p>Score: <b id="pscore">0</b> &middot; Apples: <b id="papples">0</b></p>
    <button id="resume">Resume</button>
    <button id="restart" class="alt">Restart</button>
    <button id="menuP" class="alt">Menu</button>
    <p class="small">Press 5 to resume</p>
  </div>

  <div id="over" class="overlay hidden">
    <h2 id="otitle">Game Over</h2>
    <p id="otext">The snake crashed.</p>
    <p>Score: <b id="oscore"></b> &middot; Best: <b id="obest"></b></p>
    <p>Apples: <b id="oapples"></b> &middot; Coins: <b id="ocoins"></b></p>
    <button id="retry">Play Again</button>
    <button id="menu2" class="alt">Menu</button>
  </div>

  <div id="toast" class="toast"></div>
</div>
<script src="game.js"></script>
</body>
</html>
